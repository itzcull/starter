pre-commit:
  parallel: false
  jobs:
    - name: lint
      glob: '*.{js,ts,tsx,jsx,mjs,cjs,json,css}'
      run: vp lint --fix {staged_files} && git add {staged_files}
    - name: fmt
      glob: '*.{js,ts,tsx,jsx,mjs,cjs,json,css}'
      run: vp fmt --write {staged_files} && git add {staged_files}
    - name: test
      glob: '*.{js,ts,tsx,jsx,mjs,cjs}'
      run: pnpm exec vp test related --run --project unit --passWithNoTests {staged_files}
    - name: codebase-audit
      run: pnpm codebase:audit

pre-push:
  jobs:
    - name: test-changed
      run: pnpm exec vp test run --changed origin/master --project unit
